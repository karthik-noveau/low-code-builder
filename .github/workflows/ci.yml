name: Check and publish local preview
on:
  push:
    branches: [master, main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm run infra:build
      - name: Validate CloudFormation locally
        run: |
          pipx install cfn-lint
          cfn-lint .build/stack.json .build/bootstrap.json .build/domain-stack.json .build/editor-certificate.json
      - name: Install DynamoDB Local
        run: npm run local:setup
      - name: Start local backend
        run: |
          node scripts/dev-local.mjs --backend-only > .build/local.log 2>&1 &
          echo $! > .build/local.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/health; then exit 0; fi
            sleep 1
          done
          cat .build/local.log
          exit 1
      - name: Verify commerce, accounts, permissions, domains and website publishing
        run: npm run test:integration
      - name: Stop local backend
        if: always()
        run: |
          if test -f .build/local.pid; then kill "$(cat .build/local.pid)" || true; fi
      - name: Package the tested editor and backend
        uses: actions/upload-artifact@v4
        with:
          name: forma-${{ github.sha }}
          path: |
            dist/
            .build/lambda.js
            .build/images/
            .build/stack.json
          include-hidden-files: true
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: local-service-log
          path: .build/local.log
          include-hidden-files: true
          retention-days: 1
